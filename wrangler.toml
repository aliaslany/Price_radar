name = "price-radar"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[triggers]
crons = ["*/30 * * * *"]  # هر ۳۰ دقیقه چک قیمت + نرخ دلار

[[d1_databases]]
binding = "DB"
database_name = "price-radar-db"
database_id = "9d9ac072-e952-40bd-ae0d-e10b0f2bc38c"

# مقادیر محرمانه را با wrangler secret put تنظیم کن، نه اینجا:
#   wrangler secret put TELEGRAM_BOT_TOKEN
#   wrangler secret put USD_RATE_API_KEY   (اگر provider نیاز به کلید داشت)

routes = [
  { pattern = "priceradar.startstar.ir/*", custom_domain = true }
]
